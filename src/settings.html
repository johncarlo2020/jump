<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Settings - Air Mouse Runner</title>
    <style>
        @font-face {
            font-family: 'Brevia';
            src: url('font/09BREVIA-BOLD.OTF') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Brevia', 'Arial', sans-serif;
            font-weight: 700;
            padding: 20px;
        }

        .settings-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
        }

        .settings-container::-webkit-scrollbar {
            width: 10px;
        }

        .settings-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        .settings-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }

        .settings-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        h1 {
            font-size: 48px;
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 24px;
            color: #764ba2;
            margin: 30px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .preset-buttons button {
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 3px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Brevia', Arial, sans-serif;
        }

        .preset-buttons button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .preset-buttons button.active {
            border-color: #29b5e8;
            box-shadow: 0 0 20px rgba(41, 181, 232, 0.6);
        }

        .setting-group {
            margin: 20px 0;
            padding: 20px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }

        .setting-group label {
            display: block;
            font-size: 18px;
            margin-bottom: 12px;
            color: #333;
        }

        .setting-value {
            float: right;
            font-weight: bold;
            color: #667eea;
            font-size: 20px;
        }

        .setting-group input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(102, 126, 234, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .setting-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .setting-group input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 40px;
        }

        .button-group button {
            padding: 18px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Brevia', Arial, sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #29b5e8 0%, #1a9dd1 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(41, 181, 232, 0.4);
        }

        .btn-secondary {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .btn-back {
            background: #764ba2;
            color: white;
        }

        .btn-back:hover {
            background: #5a3a7d;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
        }

        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #29b5e8;
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .success-message.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <h1>⚙️ Game Settings</h1>

        <div class="section-title">Difficulty Presets</div>
        <div class="preset-buttons">
            <button id="easyBtn">Easy</button>
            <button id="mediumBtn" class="active">Medium</button>
            <button id="hardBtn">Hard</button>
        </div>

        <div class="section-title">Speed Settings</div>
        <div class="setting-group">
            <label>
                Initial Speed: <span class="setting-value" id="speedValue">7.2</span>
            </label>
            <input type="range" id="speedSlider" min="2" max="12" step="0.1" value="7.2">
        </div>

        <div class="setting-group">
            <label>
                Max Speed: <span class="setting-value" id="maxSpeedValue">21.6</span>
            </label>
            <input type="range" id="maxSpeedSlider" min="10" max="35" step="0.1" value="21.6">
        </div>

        <div class="section-title">Player Physics</div>
        <div class="setting-group">
            <label>
                Jump Force: <span class="setting-value" id="jumpForceValue">20</span>
            </label>
            <input type="range" id="jumpForceSlider" min="15" max="30" step="1" value="20">
        </div>

        <div class="setting-group">
            <label>
                Gravity: <span class="setting-value" id="gravityValue">0.5</span>
            </label>
            <input type="range" id="gravitySlider" min="0.2" max="1.2" step="0.05" value="0.5">
        </div>

        <div class="setting-group">
            <label>
                Fast Fall Multiplier: <span class="setting-value" id="fallMultiplierValue">2.5</span>
            </label>
            <input type="range" id="fallMultiplierSlider" min="1.5" max="4" step="0.1" value="2.5">
        </div>

        <div class="section-title">Mouse Controls</div>
        <div class="setting-group">
            <label>
                Jump Sensitivity: <span class="setting-value" id="sensitivityValue">7</span>
            </label>
            <input type="range" id="sensitivitySlider" min="3" max="15" step="1" value="7">
        </div>

        <div class="setting-group">
            <label>
                Fall Speed Sensitivity: <span class="setting-value" id="fallSensitivityValue">5</span>
            </label>
            <input type="range" id="fallSensitivitySlider" min="2" max="10" step="1" value="5">
        </div>

        <div class="section-title">Spawn Settings</div>
        <div class="setting-group">
            <label>
                Obstacle Spawn Rate: <span class="setting-value" id="obstacleSpawnValue">10%</span>
            </label>
            <input type="range" id="obstacleSpawnSlider" min="0" max="50" step="5" value="10">
        </div>

        <div class="setting-group">
            <label>
                Positive Collectible Rate: <span class="setting-value" id="positiveRateValue">91%</span>
            </label>
            <input type="range" id="positiveRateSlider" min="50" max="100" step="5" value="91">
        </div>

        <div class="setting-group">
            <label>
                Drop Frequency: <span class="setting-value" id="dropRateValue">80</span>
            </label>
            <input type="range" id="dropRateSlider" min="60" max="180" step="10" value="80">
        </div>

        <div class="setting-group">
            <label>Obstacle Size: <span class="setting-value" id="obstacleSizeValue">1.0x</span></label>
            <input type="range" id="obstacleSizeSlider" min="0.5" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="setting-group">
            <label>Bone Size: <span class="setting-value" id="boneSizeValue">100px</span></label>
            <input type="range" id="boneSizeSlider" min="40" max="250" step="10" value="100">
        </div>

        <div class="setting-group">
            <label>Arm Size: <span class="setting-value" id="armSizeValue">100px</span></label>
            <input type="range" id="armSizeSlider" min="40" max="250" step="10" value="100">
        </div>

        <div class="setting-group">
            <label>Bomb Size: <span class="setting-value" id="bombSizeValue">160px</span></label>
            <input type="range" id="bombSizeSlider" min="40" max="300" step="10" value="160">
        </div>

        <div class="button-group">
            <button id="backBtn" class="btn-back">← Back to Game</button>
            <button id="resetBtn" class="btn-secondary">Reset to Default</button>
            <button id="saveBtn" class="btn-primary">Save Settings</button>
        </div>
    </div>

    <div id="successMessage" class="success-message">Settings saved successfully!</div>

    <script type="module" src="./settings.js"></script>
</body>
</html>
